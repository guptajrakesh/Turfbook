# Render blueprint: API + worker + Postgres in Singapore (closest region to India).
# Deploys a DEMO: OTP codes are shown on screen and payments are simulated, because
# no SMS provider or Razorpay account is connected yet. See README "Going live".
services:
  - type: web
    name: turftime-api
    runtime: python
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m app.seed  # creates tables; loads demo data only into an empty database
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase: { name: turftime-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: OTP_DEV_MODE
        value: "true"
      - key: PAYMENTS_MODE
        value: mock
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        generateValue: true
  - type: worker
    name: turftime-worker
    runtime: python
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.worker
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase: { name: turftime-db, property: connectionString }
databases:
  - name: turftime-db
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: "16"
